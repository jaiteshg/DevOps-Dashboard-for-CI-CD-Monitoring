name: Manual workflow

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Node
        run: |
          node -v
          npm -v

      - name: Run some logs
        run: |
          echo "Starting build..."
          sleep 2
          echo "Installing dependencies..."
          sleep 2
          echo "Build successful!"